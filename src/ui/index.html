<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Messenger</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Simple Messenger — EECE/CS 3093C Lab 1</h1>
  <h3>Team 1 Demo 0.1.0</h3>
  <br>
  <div id="loginUI" >
    <input type="text" id="username" placeholder="Username">
    <button class="button" id="joinBtn">Join Chat</button>
  </div>
<div id="chatUI" style="display: none;">
  <div>
    
    Chat message:
    <div id="chat-message" contenteditable="true" style="width:450px; border:1px solid black; padding: 5px 5px;" ></div>  
    <div class="tool-bar" style="padding: 5px 0px;">
      <button id="link-button">link</button>
      <button id="send-button" class="button round">Send</button>
      
    </div>
  </div>
  <br>
  <b>System Status</b><br>
  <div id="status" style="width: 625px; height: 75px; overflow-y: scroll;"></div>
  
  <div class="chat-box-user-list">
    <b>Users</b>
    <b>Chat Responses</b>
    <div id="user-list"></div>
    <div id="responses"></div>
  </div>
  
  
  <!-- F1.5: Private (direct) messaging -->
  <div class="private-chat-box" style="margin-top: 15px;">
    <b>Private Message</b><br>
    <input type="text" id="private-to" placeholder="Recipient username" style="width: 150px;">
    <div id="private-message" contenteditable="true"
         style="width:450px; border:1px solid black; padding: 5px 5px; display:inline-block; vertical-align:middle;"></div>
    <button id="private-send-button" class="button round">Send Private</button>
    <div id="private-responses" style="width: 625px; height: 100px; overflow-y: scroll; border:1px solid #ccc; margin-top:5px;"></div>
  </div>
  
  <script src="client.js"></script>
</div>
</body>
</html>
